apiVersion: v1
kind: PersistentVolume
metadata:
  name: nextcloud-data-pv
spec:
  capacity:
    storage: 5Ti
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: nextcloud-data
  mountOptions:
    - vers=4.1
  nfs:
    server: truenas.prjv.nl
    path: /mnt/Pool_1/NextCloud
