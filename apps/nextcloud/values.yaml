nextcloud:
  host: nc.prjv.nl

  trustedDomains:
    - nc.prjv.nl

  extraEnv:
    - name: OVERWRITECLIURL
      value: https://nc.prjv.nl
    - name: OVERWRITEHOST
      value: nc.prjv.nl

  configs:
    trusted-proxy.config.php: |
      <?php
      $CONFIG = array(
        'trusted_proxies' => array(
          '10.42.0.0/16',
          '10.43.0.0/16'
        ),
        'forwarded_for_headers' => array(
          'HTTP_X_FORWARDED_FOR',
        ),
      );

persistence:
  enabled: true

  nextcloudData:
    enabled: true
    existingClaim: nextcloud-data-pvc

phpClientHttpsFix:
  enabled: true
  protocol: https

internalDatabase:
  enabled: false

postgresql:
  enabled: false

redis:
  enabled: true

externalDatabase:
  enabled: true
  type: postgresql

  existingSecret:
    enabled: true
    secretName: nextcloud-config
    usernameKey: db-username
    passwordKey: db-password
    hostKey: db-host
    databaseKey: db-name

ingress:
  enabled: true
  className: nginx

  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod

  tls:
    - secretName: nextcloud-tls
      hosts:
        - nc.prjv.nl
