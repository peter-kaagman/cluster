nextcloud:
  host: nc.prjv.nl

  trustedDomains:
    - nc.prjv.nl

  extraEnv:
    - name: OVERWRITECLIURL
      value: https://nc.prjv.nl
    - name: OVERWRITEHOST
      value: nc.prjv.nl

  phpConfigs:
    uploads.ini: |
      upload_max_filesize = 10G
      post_max_size = 10G
      max_execution_time = 3600
      max_input_time = 3600

  configs:
    local-servers.config.php: |
      <?php
      $CONFIG = array(
        'allow_local_remote_servers' => true,
      );

    maintenance.config.php: |
      <?php
      $CONFIG = array(
        'maintenance_window_start' => 3,
      );

    trusted-proxy.config.php: |
      <?php
      $CONFIG = array(
        'trusted_proxies' => array(
          '10.42.0.0/16',
          '10.43.0.0/16'
        ),
        'forwarded_for_headers' => array(
          'HTTP_X_FORWARDED_FOR',
        ),
      );

    default-region.config.php: |
      <?php
      $CONFIG = array(
        'default_phone_region' => 'NL',
      );

cronjob:
  enabled: true

persistence:
  enabled: true

  nextcloudData:
    enabled: true
    existingClaim: nextcloud-data-pvc

phpClientHttpsFix:
  enabled: true
  protocol: https

internalDatabase:
  enabled: false

postgresql:
  enabled: false

redis:
  enabled: true

externalDatabase:
  enabled: true
  type: postgresql

  existingSecret:
    enabled: true
    secretName: nextcloud-config
    usernameKey: db-username
    passwordKey: db-password
    hostKey: db-host
    databaseKey: db-name

ingress:
  enabled: false
  className: nginx

  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-body-size: "10G"

  tls:
    - secretName: nextcloud-tls
      hosts:
        - nc.prjv.nl
