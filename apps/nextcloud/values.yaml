nextcloud:
  host: nc.prjv.nl

  trustedDomains:
    - nc.prjv.nl

  configs:
    proxy.config.php: |-
      <?php
      $CONFIG = array (
        'overwriteprotocol' => 'https',
        'overwrite.cli.url' => 'https://nc.prjv.nl',
        'trusted_proxies' => array (
          0 => '10.42.0.0/16',
          1 => '10.43.0.0/16',
        ),
      );

internalDatabase:
  enabled: false

postgresql:
  enabled: false

redis:
  enabled: true

externalDatabase:
  enabled: true
  type: postgresql

  existingSecret:
    enabled: true
    secretName: nextcloud-config
    usernameKey: db-username
    passwordKey: db-password
    hostKey: db-host
    databaseKey: db-name

ingress:
  enabled: true
  className: nginx

  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod

  tls:
    - secretName: nextcloud-tls
      hosts:
        - nc.prjv.nl
