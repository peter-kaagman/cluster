testFramework:
  enabled: false

admin:
  existingSecret: grafana-admin-secret
  userKey: admin-user
  passwordKey: admin-password

ingress:
  enabled: true
  ingressClassName: nginx
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-dns01"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
    # nginx.ingress.kubernetes.io/auth-type: "basic"
    # nginx.ingress.kubernetes.io/auth-secret: "argocd-basic-auth"
    # nginx.ingress.kubernetes.io/auth-realm: "Authentication Required"
    nginx.ingress.kubernetes.io/whitelist-source-range: "192.168.5.0/24,192.168.15.0/24"
  hosts:
    - grafana.prjv.nl
  path: /
  pathType: Prefix
  tls:
    - secretName: grafana-tls
      hosts:
        - grafana.prjv.nl

extraVolumes:
  - name: grafana-datasources
    configMap:
      name: grafana-datasources
  - name: grafana-dashboard-providers
    configMap:
      name: grafana-dashboard-providers
  - name: grafana-dashboard-ingress
    configMap:
      name: grafana-dashboard-ingress-traffic-first-panel

extraVolumeMounts:
  - name: grafana-datasources
    mountPath: /etc/grafana/provisioning/datasources
    readOnly: true
  - name: grafana-dashboard-providers
    mountPath: /etc/grafana/provisioning/dashboards
    readOnly: true
  - name: grafana-dashboard-ingress
    mountPath: /var/lib/grafana/dashboards/default
    readOnly: true

envValueFrom:
  GF_AUTH_GENERIC_OAUTH_CLIENT_ID:
    secretKeyRef:
      name: grafana-oauth-secret
      key: client-id

  GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET:
    secretKeyRef:
      name: grafana-oauth-secret
      key: client-secret

grafana.ini:
  server:
    root_url: https://grafana.prjv.nl

  "auth.generic_oauth":
    enabled: true
    auto_login: false
    name: Authentik
    allow_sign_up: true

    client_id: $__env{GF_AUTH_GENERIC_OAUTH_CLIENT_ID}
    client_secret: $__env{GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET}

    scopes: openid profile email

    auth_url: https://portal.prjv.nl/application/o/authorize/
    token_url: https://portal.prjv.nl/application/o/token/
    api_url: https://portal.prjv.nl/application/o/userinfo/

    login_attribute_path: preferred_username
    name_attribute_path: name
    email_attribute_path: email

    role_attribute_path: "'Admin'"