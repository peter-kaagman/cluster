apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: pg-nc
  namespace: argocd
  labels:
    mprjv65/service: pg-nc
    mprjv65/type: platform
    mprjv65/role: database
    mprjv65/storage: local
    mprjv65/criticality: high
  annotations:
    mprjv65/depends-on: cloudnative-pg
    mprjv65/owner: peter


spec:
  project: default

  source:
    repoURL: https://github.com/peter-kaagman/cluster.git
    targetRevision: main
    path: databases/pg-nc

  destination:
    server: https://kubernetes.default.svc
    namespace: pg-nc

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true
