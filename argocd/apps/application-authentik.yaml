apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: authentik
  namespace: argocd

spec:
  project: default

  destination:
    namespace: authentik
    server: https://kubernetes.default.svc

  sources:
    - repoURL: https://charts.goauthentik.io
      chart: authentik
      targetRevision: 2026.5.6
      helm:
        valueFiles:
          - $values/identity/authentik/values.yaml

    - repoURL: https://github.com/peter-kaagman/cluster.git
      targetRevision: main
      ref: values

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true