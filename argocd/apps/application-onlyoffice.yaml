apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: onlyoffice
  namespace: argocd
  labels:
    mprjv65/service: onlyoffice
    mprjv65/type: application
    mprjv65/role: collaboration
    mprjv65/storage: local
    mprjv65/criticality: medium
  annotations:
    mprjv65/owner: peter

spec:
  project: default

  source:
    repoURL: https://github.com/peter-kaagman/cluster.git
    targetRevision: main
    path: apps/onlyoffice

  destination:
    server: https://kubernetes.default.svc
    namespace: onlyoffice

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
