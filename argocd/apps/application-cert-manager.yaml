apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager
  namespace: argocd
  labels:
    mprjv65/service: cert-manager
    mprjv65/type: platform
    mprjv65/role: controller
  annotations:
    mprjv65/owner: team-platform
spec:
  project: default
  sources:
    - repoURL: https://charts.jetstack.io
      chart: cert-manager
      targetRevision: v1.20.2
      helm:
        releaseName: cert-manager
        valueFiles:
          - $values/argocd/values/cert-manager.yaml
    - repoURL: git@github.com:peter-kaagman/cluster.git
      targetRevision: main
      ref: values
    - repoURL: git@github.com:peter-kaagman/cluster.git
      targetRevision: main
      path: cert-manager
  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager
  syncPolicy:
    automated: {}
    syncOptions:
      - CreateNamespace=true
