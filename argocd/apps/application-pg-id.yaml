apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: pg-id
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/<jouw-repo>
    targetRevision: HEAD
    path: databases/pg-id

  destination:
    server: https://kubernetes.default.svc
    namespace: pg-id

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true