apiVersion: v1
kind: Pod
metadata:
  name: mysite-restore
  namespace: mysite
spec:
  restartPolicy: Never

  containers:
  - name: restore
    image: busybox
    command:
      - sleep
      - "36000"

    volumeMounts:
    - name: db
      mountPath: /restore/db

    - name: images
      mountPath: /restore/images

    - name: logs
      mountPath: /restore/logs

    - name: backup
      mountPath: /backup

  volumes:
  - name: db
    persistentVolumeClaim:
      claimName: mysite-db-pvc

  - name: images
    persistentVolumeClaim:
      claimName: mysite-images-pvc

  - name: logs
    persistentVolumeClaim:
      claimName: mysite-logs-pvc

  - name: backup
    persistentVolumeClaim:
      claimName: test-truenas
